services:
  mysql:
    image: mysql:8.0
    container_name: microblog_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microblog
      MYSQL_USER: microbloguser
      MYSQL_PASSWORD: microblogpass
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - microblog_network

  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
    container_name: microblog_prod
    environment:
      DATABASE_URL: mysql+pymysql://microbloguser:microblogpass@mysql:3306/microblog
      SECRET_KEY: devops-microblog-secret-key-123
      FLASK_APP: app
      FLASK_ENV: production
      WEBHOOK_URL: https://webhook.site/573ae324-ea03-4f12-8f29-a6dbfb5b3cd7
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && flask run --host=0.0.0.0"
    networks:
      - microblog_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    container_name: microblog_test
    environment:
      DATABASE_URL: mysql+pymysql://microbloguser:microblogpass@mysql:3306/microblog
      SECRET_KEY: devops-microblog-secret-key-123
      FLASK_APP: app
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microblog_network

  # ===== PROMETHEUS SERVICE =====
  prometheus:
    image: prom/prometheus:latest
    container_name: microblog_prometheus
    ports:
      - "9090:9090"
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./alerts.yml:/etc/prometheus/alerts.yml:ro   
    - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - prod
    networks:
      - microblog_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== GRAFANA SERVICE =====
  grafana:
    image: grafana/grafana:latest
    container_name: microblog_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - microblog_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  alertmanager:
    image: prom/alertmanager:latest
    container_name: microblog_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - microblog_network
volumes:
  mysql_data:
  prometheus_data:
  grafana_storage:

networks:
  microblog_network:
    driver: bridge