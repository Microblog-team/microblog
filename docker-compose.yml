
networks:
  monitor:

volumes:
  mysql_data:
  grafana_data: {}

services:
  node-exporter:
    image: prom/node-exporter:v1.2.2
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    networks:
      - monitor

  prometheus:
    image: prom/prometheus:v2.45.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus_data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus_data'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=24h'
      - '--web.enable-lifecycle'
    networks:
      - monitor
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:8.2.4
    restart: unless-stopped
    volumes: 
      - grafana_data:/var/lib/grafana
    networks:
      - monitor
    ports:
      - "3001:3000"

  mysql:
    image: mysql:8.0
    container_name: microblog_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microblog
      MYSQL_USER: microbloguser
      MYSQL_PASSWORD: microblogpass
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
    container_name: microblog_prod
    environment:
      DATABASE_URL: mysql+pymysql://microbloguser:microblogpass@mysql:3306/microblog
      SECRET_KEY: devops-microblog-secret-key-123
      FLASK_APP: app
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && flask run --host=0.0.0.0"

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    container_name: microblog_test
    environment:
      DATABASE_URL: mysql+pymysql://microbloguser:microblogpass@mysql:3306/microblog
      SECRET_KEY: devops-microblog-secret-key-123
      FLASK_APP: app
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      mysql:
        condition: service_healthy